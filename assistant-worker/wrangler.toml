binding = "AI"

[vars]
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
FALLBACK_MODEL = "@cf/meta/llama-3.2-3b-instruct"
RATE_LIMIT_PER_MIN = "8"
